# Render web service. The free instance type requires a Render account.
# Create the service from this file, then set the secret env vars in the dashboard.
# Do not commit values for XAI_API_KEY or SNOWFLAKE_PAT_TOKEN.
services:
  - type: web
    name: signal-service
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: WAREHOUSE_BACKEND
        value: duckdb
      - key: SIGNAL_DUCKDB_PATH
        value: /data/demo.duckdb
      - key: XAI_API_KEY
        sync: false
      - key: SNOWFLAKE_PAT_TOKEN
        sync: false
      - key: SNOWFLAKE_MCP_URL
        sync: false
      - key: GROK_MODEL
        value: grok-4.7
